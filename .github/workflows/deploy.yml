name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: stechpay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stechpay_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable-database
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install and audit backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt pip-audit bandit
          python -m pip check
          pip-audit -r backend/requirements.txt --no-deps --disable-pip
          bandit -r backend/stechpay backend/userapp -x backend/stechpay/test_settings.py,backend/userapp/tests.py,backend/userapp/test_security.py,backend/userapp/test_concurrency.py -ll
          python security-audit/check_secrets.py
          python deployment/test_backup_upload.py
      - name: Backend regression and concurrency tests
        working-directory: backend
        env:
          TEST_POSTGRES_DB: ${{ matrix.database == 'postgres' && 'stechpay_ci' || '' }}
          TEST_POSTGRES_USER: postgres
          TEST_POSTGRES_PASSWORD: ci-only-disposable-database
          TEST_POSTGRES_HOST: localhost
          TEST_SQLITE_FILE: ${{ runner.temp }}/stechpay-ci.sqlite3
        run: |
          python manage.py makemigrations --check --dry-run --settings=stechpay.test_settings
          python manage.py test userapp --settings=stechpay.test_settings --noinput
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/stechpay/package-lock.json
      - name: Audit and build frontend
        working-directory: frontend/stechpay
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run lint
          npm run build
      - name: Browser flow regression tests
        if: matrix.database == 'sqlite'
        working-directory: frontend/stechpay
        run: |
          npx playwright install --with-deps chromium
          npm test

  deploy:
    timeout-minutes: 20
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the tested revision over verified SSH
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USERNAME }}
          DEPLOY_PORT: ${{ secrets.PROD_PORT || '22' }}
          DEPLOY_KEY: ${{ secrets.PROD_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          TESTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_KEY"
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/stechpay"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/stechpay" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/stechpay" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "stechpay-deploy $TESTED_SHA"
