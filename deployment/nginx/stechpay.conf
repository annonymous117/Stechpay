limit_req_zone $binary_remote_addr zone=stechpay_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=stechpay_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=stechpay_webhook:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/stechpay-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com www.example.com;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    large_client_header_buffers 2 8k;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header Strict-Transport-Security;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    root /srv/stechpay/frontend/stechpay/dist;
    index index.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /service-unavailable.html;
    location = /404.html { internal; }
    location = /service-unavailable.html { internal; }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"detail":"STechPay is temporarily unavailable. Please try again shortly."}';
    }
    location @api_limited {
        default_type application/json;
        return 429 '{"detail":"Too many requests. Please wait a moment and try again."}';
    }
    location ~ ^/(sign-in(/verify)?|dashboard|verify|callback)/?$ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        error_page 502 503 504 =503 @api_unavailable;
        error_page 429 =429 @api_limited;
        limit_req zone=stechpay_api burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/stechpay/gunicorn.sock:;
    }

    location ~ ^/api/admin/login/(confirm/|challenge/)?$ {
        error_page 502 503 504 =503 @api_unavailable;
        error_page 429 =429 @api_limited;
        limit_req zone=stechpay_login burst=10 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/stechpay/gunicorn.sock;
    }

    location = /api/payments/webhook/ {
        error_page 502 503 504 =503 @api_unavailable;
        error_page 429 =429 @api_limited;
        limit_req zone=stechpay_webhook burst=100 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/stechpay/gunicorn.sock;
    }

    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/stechpay/gunicorn.sock:;
    }

    location /static/ {
        alias /srv/stechpay/backend/staticfiles/;
    }
}
